# Builds, tests and packages Claude Together.
#   push / pull request : build both exes, run the core tests, build and smoke-test the MSI
#   push to main with a version that has no tag yet:
#                         the same, then create the tag v<version> and a GitHub Release with the MSI
#   tag v<version>      : the same, then publish a GitHub Release (manual tag; it must match the version)
# The version is written once, in src/Cli.cs (Cli.Version). Nothing else needs editing to release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WIX_VERSION: 5.0.2

jobs:
  test:
    name: Core tests (Linux, Mono)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Mono
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete
      - name: Build both executables
        run: sh build.sh
      - name: Run core tests
        run: sh tests/run.sh

  windows:
    name: Build, package and test (Windows)
    runs-on: windows-latest
    needs: test
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and decide whether to release
        id: version
        run: |
          $ver = (Select-String -Path src\Cli.cs -Pattern 'Version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          $tag = "v$ver"
          $release = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne $tag) { throw "Tag $env:GITHUB_REF_NAME does not match version $ver" }
            $release = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main') {
            # A version without a tag yet is a new release. 'ls-remote --exit-code' exits 2 when no ref matches.
            git ls-remote --exit-code --tags origin "refs/tags/$tag" | Out-Null
            if ($LASTEXITCODE -eq 2) { $release = 'true' }
            elseif ($LASTEXITCODE -ne 0) { throw "Could not look up the tag $tag" }
            $global:LASTEXITCODE = 0
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          "VERSION=$ver" >> $env:GITHUB_ENV
          Write-Host "Version $ver, release: $release"

      - name: Build both executables
        shell: cmd
        run: build.cmd

      - name: Check the version inside the executables
        run: |
          foreach ($f in 'ClaudeTogether.exe', 'claude-together.exe') {
            $v = (Get-Item "bin\$f").VersionInfo.FileVersion
            if ($v -ne "$env:VERSION.0") { throw "$f has file version $v, expected $env:VERSION.0" }
          }
          Write-Host "Both executables report $env:VERSION"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add --global "WixToolset.UI.wixext/$env:WIX_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "Could not add the WiX UI extension" }

      - name: Build the MSI
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          wix build installer\ClaudeTogether.wxs `
            -ext WixToolset.UI.wixext -arch x64 -pdbtype none `
            -d Version=$env:VERSION -d BinDir=bin -d IconFile=assets\app.ico `
            -d LicenseFile=installer\license.rtf -d LicenseText=LICENSE `
            -o "dist\ClaudeTogether-$env:VERSION.msi"
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          # 'wix build' does not validate; ICE91 only says per-user files stay per-user, which is intended.
          wix msi validate -sice ICE91 "dist\ClaudeTogether-$env:VERSION.msi"
          if ($LASTEXITCODE -ne 0) { throw "MSI validation failed" }

      - name: Check that the MSI needs no administrator rights
        run: |
          $msi = (Resolve-Path "dist\ClaudeTogether-$env:VERSION.msi").Path
          function Get-Com($o, $name, $comArgs) { $o.GetType().InvokeMember($name, 'GetProperty', $null, $o, $comArgs) }
          function Invoke-Com($o, $name, $comArgs) { $o.GetType().InvokeMember($name, 'InvokeMethod', $null, $o, $comArgs) }
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            $db = Invoke-Com $installer 'OpenDatabase' @($msi, 0)
            # Summary property 15 (word count): bit 8 means "no elevated privileges needed".
            $words = [int](Get-Com (Get-Com $db 'SummaryInformation' @(0)) 'Property' @(15))
            $view = Invoke-Com $db 'OpenView' @("SELECT Value FROM Property WHERE Property = 'ALLUSERS'")
            Invoke-Com $view 'Execute' $null | Out-Null
            $allUsers = Invoke-Com $view 'Fetch' $null
          } catch {
            Write-Warning "Could not read the MSI tables ($($_.Exception.Message)); relying on the install test below."
            return
          }
          if (($words -band 8) -eq 0) { throw "The MSI asks for elevation (word count $words)" }
          if ($allUsers -ne $null) { throw "The MSI sets ALLUSERS, so it would install per machine" }
          Write-Host "OK: per-user package, no elevation needed (word count $words)"

      - name: Install the MSI
        run: |
          $msi = (Resolve-Path "dist\ClaudeTogether-$env:VERSION.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 60; throw "Install failed with exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ClaudeTogether'
          foreach ($f in 'ClaudeTogether.exe', 'claude-together.exe', 'LICENSE.txt') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }
          # Windows Installer writes the folder with a trailing backslash.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | ForEach-Object { $_.TrimEnd('\') }
          if ($userPath -notcontains $dir) { throw "User PATH does not contain $dir" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Claude Together.lnk'
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing: $lnk" }
          Write-Host "Installed to $dir"

      - name: Smoke test the installed CLI
        run: |
          $cli = Join-Path $env:LOCALAPPDATA 'Programs\ClaudeTogether\claude-together.exe'
          $env:CLAUDE_TOGETHER_LANG = 'en'
          function Invoke-Cli([int]$Expect, [string[]]$CliArgs) {
            $out = & $cli @CliArgs 2>&1 | Out-String
            if ($LASTEXITCODE -ne $Expect) { throw "claude-together $($CliArgs -join ' ') exited $LASTEXITCODE, expected ${Expect}: $out" }
            return $out
          }

          if ((Invoke-Cli 0 @('version')) -notmatch "claude-together $env:VERSION") { throw "Wrong version printed" }
          Invoke-Cli 0 @('list', '--json') | Out-Null          # also exercises the WMI process query
          Invoke-Cli 3 @('setup', 'work', 'personal', '-y') | Out-Null   # 3 = accounts still need to sign in

          $scan = Invoke-Cli 0 @('scan', '--json') | ConvertFrom-Json
          if (@($scan | Where-Object { $_.registered }).Count -ne 2) { throw "scan did not list both accounts" }
          Invoke-Cli 3 @('whoami') | Out-Null

          $link = Get-Item (Join-Path $env:USERPROFILE '.claude-work\projects')
          if ($link.LinkType -ne 'Junction') { throw "projects is not a junction (LinkType '$($link.LinkType)')" }

          Invoke-Cli 0 @('skill', 'install') | Out-Null
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.claude-personal\skills\claude-together\SKILL.md'))) { throw "Skill is not visible from the second profile" }

          # delegate through a stand-in 'claude.cmd'
          $fake = Join-Path $env:RUNNER_TEMP 'fake'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content (Join-Path $fake 'claude.cmd') "@echo off`r`nfindstr `"^`"`r`necho acct=%CLAUDE_TOGETHER_ACCOUNT% depth=%CLAUDE_TOGETHER_DEPTH%`r`necho args=%*" -Encoding ascii
          Set-Content (Join-Path $env:USERPROFILE '.claude-personal\.credentials.json') '{}'
          $env:PATH = "$fake;$env:PATH"
          $res = Invoke-Cli 0 @('delegate', 'personal', '--prompt', 'hello there', '--max-turns', '2', '--json', '--cwd', $env:RUNNER_TEMP) | ConvertFrom-Json
          if ($res.exitCode -ne 0) { throw "delegate failed: $($res | ConvertTo-Json)" }
          foreach ($want in 'hello there', 'acct=personal depth=1', 'args=-p --max-turns 2') {
            if ($res.output -notmatch [regex]::Escape($want)) { throw "delegate output lacks '$want': $($res.output)" }
          }

          # 'install' and 'uninstall' are for the portable zip and must leave an MSI install alone
          foreach ($cmd in 'install', 'uninstall') {
            $out = & bin\claude-together.exe $cmd 2>&1 | Out-String
            if ($LASTEXITCODE -ne 1 -or $out -notmatch 'MSI') { throw "'$cmd' did not step aside for the MSI (exit $LASTEXITCODE): $out" }
          }
          # The step ends with the exit code of the last native command; the expected 1 above must not fail it.
          $global:LASTEXITCODE = 0
          Write-Host "CLI smoke test passed"

      - name: Smoke test the installed app window
        run: |
          $gui = Join-Path $env:LOCALAPPDATA 'Programs\ClaudeTogether\ClaudeTogether.exe'
          $p = Start-Process $gui -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) { throw "ClaudeTogether.exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "App window stayed open"

      - name: Uninstall the MSI
        run: |
          $msi = (Resolve-Path "dist\ClaudeTogether-$env:VERSION.msi").Path
          $p = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /norestart /l*v `"$env:RUNNER_TEMP\uninstall.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log" -Tail 60; throw "Uninstall failed with exit code $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ClaudeTogether'
          if (Test-Path $dir) { throw "Install folder is still there after uninstall: $dir" }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | ForEach-Object { $_.TrimEnd('\') }
          if ($userPath -contains $dir) { throw "PATH entry was not removed" }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.claude-work'))) { throw "Uninstall must not touch account data" }
          Write-Host "Uninstalled cleanly; account data untouched"

      - name: Test install and uninstall without the MSI
        run: |
          $env:CLAUDE_TOGETHER_LANG = 'en'
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\ClaudeTogether'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Claude Together.lnk'
          function Test-UserPath { ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | ForEach-Object { $_.TrimEnd('\') }) -contains $dir }
          # The raw registry value, without empty entries: %VAR% entries must come back unexpanded.
          function Get-RawUserPath { @((Get-Item 'HKCU:\Environment').GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';' | Where-Object { $_ }) -join ';' }
          $before = Get-RawUserPath

          & bin\claude-together.exe install
          if ($LASTEXITCODE -ne 0) { throw "install exited $LASTEXITCODE" }
          foreach ($f in 'ClaudeTogether.exe', 'claude-together.exe') {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "Missing after install: $f" }
          }
          if (-not (Test-UserPath)) { throw "User PATH does not contain $dir" }
          if (-not (Test-Path $lnk)) { throw "Start Menu shortcut missing: $lnk" }

          & (Join-Path $dir 'claude-together.exe') install      # a second run changes nothing
          if ($LASTEXITCODE -ne 0) { throw "second install exited $LASTEXITCODE" }
          if (@([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_.TrimEnd('\') -eq $dir }).Count -ne 1) { throw "PATH entry was added twice" }

          & (Join-Path $dir 'claude-together.exe') uninstall
          if ($LASTEXITCODE -ne 0) { throw "uninstall exited $LASTEXITCODE" }
          if (Test-UserPath) { throw "PATH entry was not removed" }
          if (Test-Path $lnk) { throw "Start Menu shortcut was not removed" }
          $after = Get-RawUserPath
          if ($after -ne $before) { throw "User PATH changed: '$before' -> '$after'" }
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.claude-work'))) { throw "Uninstall must not touch account data" }
          Write-Host "Portable install and uninstall work; PATH restored"

      - name: Collect release files
        run: |
          Compress-Archive -Path bin\ClaudeTogether.exe, bin\claude-together.exe, LICENSE -DestinationPath "dist\ClaudeTogether-$env:VERSION-portable.zip"
          $lines = Get-ChildItem dist -File | ForEach-Object { $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(); "$h  $($_.Name)" }
          $lines | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: claude-together-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: windows
    if: needs.windows.outputs.release == 'true'
    concurrency: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: claude-together-${{ needs.windows.outputs.version }}
          path: dist
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.windows.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released; nothing to do."
            exit 0
          fi
          # For a version without a tag, this creates the tag on the tested commit.
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Claude Together $VERSION" \
            --generate-notes
